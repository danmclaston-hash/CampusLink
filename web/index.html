<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="CampusLink – one place for every Cavendish University student to find help, stay informed and connect.">
  <meta name="theme-color" content="#3B2DB3">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CampusLink">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CampusLink</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #3B2DB3; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(135deg, #3B2DB3, #7C3AED 55%, #FF6B6B);
      color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      transition: opacity .4s ease;
    }
    #splash .logo {
      width: 76px; height: 76px; border-radius: 22px;
      background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.4);
      display: grid; place-items: center; font-size: 38px;
    }
    #splash h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -.5px; }
    #splash p { margin: 0; opacity: .9; font-size: 14px; }
    #splash .bar { width: 140px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; height: 100%; width: 40%; background: #fff; border-radius: 2px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(350%);} }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo">🔗</div>
    <h1>CampusLink</h1>
    <p>Loading your campus…</p>
    <div class="bar"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

name: campuslink
description: "CampusLink – one place for every Cavendish student to find help, stay informed and connect."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Backend (optional – app falls back to demo mode without keys)
  supabase_flutter: ^2.8.0

  # Local persistence (demo mode + offline cache)
  shared_preferences: ^2.3.3

  # Timetable import
  file_picker: ^8.1.4
  excel: ^4.0.6
  csv: ^6.0.0

  # Utilities
  intl: ^0.20.1
  uuid: ^4.5.1
  crypto: ^3.0.6
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
